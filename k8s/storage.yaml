apiVersion: v1
kind: Namespace
metadata:
  name: gfs
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gfs-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gfs-master
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gfs-local
  local:
    path: /gfs/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [gfs-lab-control-plane]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-master-0
  namespace: gfs
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gfs-local
  volumeName: gfs-master
  resources:
    requests:
      storage: 5Gi
---
